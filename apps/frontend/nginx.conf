server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # 性能优化
    # ============================================

    # Gzip 压缩
    gzip on;
    gzip_static on; # 优先使用预压缩的 .gz 文件
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-web-app-manifest+json
        image/svg+xml
        image/x-icon
        font/opentype
        font/woff
        font/woff2
        font/ttf;

    # Brotli 压缩 (需要安装 ngx_brotli 模块)
    # brotli on;
    # brotli_static on; # 优先使用预压缩的 .br 文件
    # brotli_comp_level 6;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/xml
    #     text/javascript
    #     application/javascript
    #     application/x-javascript
    #     application/json
    #     application/xml
    #     application/rss+xml
    #     application/atom+xml
    #     application/vnd.ms-fontobject
    #     application/x-font-ttf
    #     application/x-web-app-manifest+json
    #     image/svg+xml
    #     image/x-icon
    #     font/opentype
    #     font/woff
    #     font/woff2;

    # 开启 sendfile 优化文件传输
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 客户端缓存设置
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ============================================
    # 安全头配置
    # ============================================

    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 防止 MIME 类型混淆攻击
    add_header X-Content-Type-Options "nosniff" always;

    # XSS 保护
    add_header X-XSS-Protection "1; mode=block" always;

    # 引用来源策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 内容安全策略 (根据实际需要调整)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss:; frame-ancestors 'self';" always;

    # 权限策略
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 隐藏 nginx 版本号
    server_tokens off;

    # ============================================
    # 路由配置
    # ============================================

    # WebSocket 升级映射 (如果主配置没生效，这里再定义一次)
    # map $http_upgrade $connection_upgrade {
    #     default upgrade;
    #     '' close;
    # }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Vue Router history 模式支持
    location / {
        try_files $uri $uri/ /index.html;

        # 禁止缓存 index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # API 代理
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;

        # 代理超时设置
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # WebSocket 代理
    location /socket.io {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        # WebSocket 核心头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 转发真实 Host 和 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 确保 Proto 正确透传（支持 HTTPS）
        # 如果上层代理（如 NPM）已经设置了 X-Forwarded-Proto，我们优先使用它
        # 否则使用本地 scheme
        set $real_proto $http_x_forwarded_proto;
        if ($real_proto = "") {
            set $real_proto $scheme;
        }
        proxy_set_header X-Forwarded-Proto $real_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;

        # 彻底禁用缓冲，对实时通信至关重要
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache_bypass $http_upgrade;

        # 延长超时时间，防止长连接意外断开
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 允许跨域 (如果后端没处理好)
        # add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # 静态资源长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问敏感文件
    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
