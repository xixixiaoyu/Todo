<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta -->
    <title>简思 (Lumina)</title>
    <meta name="description" content="简于形，深于思 — 高效纯粹的 AI 个人待办" />
    <meta name="application-name" content="简思 (Lumina)" />
    <meta name="author" content="牧云 (Mu Yun)" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="./pwa-64x64.png" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180x180.png" />
    <link rel="mask-icon" href="./maskable-icon-512x512.png" color="#1a1a2e" />

    <!-- Apple Web App (iOS / iPadOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="简思" />

    <!-- Android / General Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a2e" />

    <!-- Microsoft / Windows Tile -->
    <meta name="msapplication-TileColor" content="#1a1a2e" />
    <meta name="msapplication-TileImage" content="./pwa-512x512.png" />
    <meta name="msapplication-config" content="none" />

    <!-- DNS Prefetch -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <script>
      ;(function () {
        // 同步设置初始标题，避免根据语言切换时的闪烁
        const locale =
          localStorage.getItem('locale') ||
          (navigator.language.startsWith('zh') ? 'zh-CN' : 'en-US')
        document.title = locale === 'en-US' ? 'Lumina (简思)' : '简思 (Lumina)'

        const prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (setting === 'auto' && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
