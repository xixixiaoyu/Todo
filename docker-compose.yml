# Docker Compose 生产环境部署配置
# Lumina (简思) - 全栈 Todo 应用
#
# 快速启动：
#   docker compose up -d
#
# 停止服务：
#   docker compose down
#
# 查看日志：
#   docker compose logs -f

x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '10m'
    max-file: '3'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine@sha256:6a388fba16e2a94d6d92bc3c435cdc2e20145add88547615b3d8fa545d703afe
    container_name: lumina-postgres
    restart: unless-stopped
    logging: *default-logging
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c max_connections=200
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-lumina}
    volumes:
      - lumina_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  # ============================================
  # Redis Cache & Queue
  # ============================================
  redis:
    image: redis:7-alpine@sha256:ee64a64eaab618d88051c3ade8f6352d11531fcf79d9a4818b9b183d8c1d18ba
    container_name: lumina-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - lumina_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:?REDIS_PASSWORD is required}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  # ============================================
  # Backend (NestJS)
  # ============================================
  backend:
    image: lumina-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: lumina-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-lumina}?schema=public
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: 0
      # Security
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      # Mail & Storage
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      # Extra Sync from .env.example
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-900}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-604800}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      THROTTLE_SHORT_TTL: ${THROTTLE_SHORT_TTL:-1000}
      THROTTLE_SHORT_LIMIT: ${THROTTLE_SHORT_LIMIT:-3}
      THROTTLE_MEDIUM_TTL: ${THROTTLE_MEDIUM_TTL:-10000}
      THROTTLE_MEDIUM_LIMIT: ${THROTTLE_MEDIUM_LIMIT:-20}
      THROTTLE_LONG_TTL: ${THROTTLE_LONG_TTL:-60000}
      THROTTLE_LONG_LIMIT: ${THROTTLE_LONG_LIMIT:-100}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health/liveness || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - lumina-network

  # ============================================
  # Frontend (Nginx)
  # ============================================
  frontend:
    image: lumina-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: lumina-frontend
    restart: unless-stopped
    logging: *default-logging
    # 移除直接暴露 80 端口，由 NPM 转发
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,mode=1777
      - /var/cache/nginx:rw,uid=1001,gid=1001,mode=755
    volumes:
      - lumina_frontend_logs:/var/log/nginx
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lumina-network

  # ============================================
  # GoAccess (访问日志可视化)
  # ============================================
  goaccess:
    image: allinurl/goaccess:1.9.4@sha256:9f8273d6b46fcbb7cb9334a7e8d20a6167ec570080f62731e7b2cb45803b8a2f
    container_name: lumina-goaccess
    restart: unless-stopped
    logging: *default-logging
    command: >
      sh -c "mkdir -p /srv/report &&
      touch /logs/access.log &&
      goaccess /logs/access.log
      --log-format='%h %^[%d:%t %^] \"%r\" %s %b \"%R\" \"%u\" \"%^\"'
      --date-format='%d/%b/%Y'
      --time-format='%T'
      --real-time-html
      --port=7890
      --addr=0.0.0.0
      --origin=*
      --ignore-crawlers
      --output=/srv/report/index.html"
    ports:
      - '${GOACCESS_REPORT_BIND:-127.0.0.1}:${GOACCESS_REPORT_PORT:-7890}:7890'
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - lumina_frontend_logs:/logs:ro
      - lumina_goaccess_report:/srv/report
    networks:
      - lumina-network

  # ============================================
  # Nginx Proxy Manager (HTTPS & Reverse Proxy)
  # ============================================
  npm:
    image: 'jc21/nginx-proxy-manager:2.13.7'
    container_name: lumina-npm
    restart: unless-stopped
    ports:
      - '${NPM_HTTP_BIND:-0.0.0.0}:80:80' # HTTP
      - '${NPM_HTTPS_BIND:-0.0.0.0}:443:443' # HTTPS
      - '${NPM_ADMIN_BIND:-127.0.0.1}:${NPM_ADMIN_PORT:-81}:81' # 管理后台
    volumes:
      - lumina_npm_data:/data
      - lumina_npm_letsencrypt:/etc/letsencrypt
    logging: *default-logging
    depends_on:
      - frontend
    networks:
      - lumina-network

networks:
  lumina-network:
    driver: bridge

volumes:
  lumina_postgres_data:
  lumina_redis_data:
  lumina_frontend_logs:
  lumina_goaccess_report:
  lumina_npm_data:
  lumina_npm_letsencrypt:
