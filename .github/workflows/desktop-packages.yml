name: Desktop Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/wails/**'
      - 'apps/frontend/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/desktop-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '9.15.0'

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }} installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04
            platform: linux

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/wails/go.mod
          cache-dependency-path: apps/wails/go.sum

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成构建元数据 (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "${GITHUB_REF_TYPE}" = 'tag' ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi

          case "${RUNNER_OS}" in
            Linux)
              platform='linux'
              arch='amd64'
              ext='tar.gz'
              ;;
            macOS)
              platform='macos'
              machine_arch="$(uname -m)"
              case "${machine_arch}" in
                arm64|aarch64) arch='arm64' ;;
                x86_64|amd64) arch='x64' ;;
                *) arch="${machine_arch}" ;;
              esac
              ext='dmg'
              ;;
            *)
              echo "Unsupported runner OS: ${RUNNER_OS}"
              exit 1
              ;;
          esac

          package_name="Lumina-${version}-${platform}-${arch}.${ext}"
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=${package_name}" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=${package_name}"

      - name: 生成构建元数据 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }

          $packageName = "Lumina-$version-windows-x64.exe"
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PACKAGE_NAME=$packageName"

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: 安装 NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: 安装 Wails CLI (Unix)
        if: runner.os != 'Windows'
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 安装 Wails CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          "$([System.IO.Path]::Combine((go env GOPATH), 'bin'))" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 构建 Windows 安装器
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location apps/wails
          wails build -trimpath -clean -ldflags "-s -w" -nsis

      - name: 构建 macOS 应用
        if: runner.os == 'macOS'
        run: pnpm wails:build

      - name: 构建 Linux 应用
        if: runner.os == 'Linux'
        run: pnpm wails:build

      - name: 校验 macOS 签名与公证配置
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        env:
          MACOS_SIGN_CERT_BASE64: ${{ secrets.MACOS_SIGN_CERT_BASE64 }}
          MACOS_SIGN_CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=''
          for key in MACOS_SIGN_CERT_BASE64 MACOS_SIGN_CERT_PASSWORD MACOS_SIGN_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!key}" ]; then
              missing="${missing} ${key}"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::warning::Tag 发布缺少 macOS 签名/公证 secrets:${missing}"
            echo '将继续生成未签名、未公证的 macOS 安装包。'
            exit 0
          fi

      - name: 签名 macOS 应用
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_CERT_BASE64: ${{ secrets.MACOS_SIGN_CERT_BASE64 }}
          MACOS_SIGN_CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$MACOS_SIGN_CERT_BASE64" ] || [ -z "$MACOS_SIGN_CERT_PASSWORD" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo 'Skipping macOS app signing: signing secrets are not configured.'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/certs"
          echo "$MACOS_SIGN_CERT_BASE64" | base64 -D > "$RUNNER_TEMP/certs/macos-signing.p12"
          security create-keychain -p '' build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p '' build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import "$RUNNER_TEMP/certs/macos-signing.p12" -k build.keychain -P "$MACOS_SIGN_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k '' build.keychain
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" apps/wails/build/bin/Lumina.app

      - name: 归档 Windows 安装器
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $installer = Get-ChildItem -Path 'apps/wails/build/bin' -Filter '*installer*.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $installer) {
            $installer = Get-ChildItem -Path 'apps/wails/build/bin' -Filter '*.exe' -File -Recurse | Select-Object -First 1
          }
          if ($null -eq $installer) { throw 'Missing Windows executable (*.exe) in apps/wails/build/bin' }
          Copy-Item -Path $installer.FullName -Destination "artifacts/$env:PACKAGE_NAME" -Force

      - name: 签名 Windows 安装器
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_CERT_PASSWORD)) {
            Write-Host 'Skipping Windows installer signing: signing secrets are not configured.'
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))
          signtool sign /fd SHA256 /f $pfxPath /p "$env:WINDOWS_SIGN_CERT_PASSWORD" /tr "http://timestamp.digicert.com" /td SHA256 "artifacts/$env:PACKAGE_NAME"

      - name: 生成 macOS DMG 安装器
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          test -d apps/wails/build/bin/Lumina.app
          dmg_root="$RUNNER_TEMP/dmg-root"
          rm -rf "$dmg_root"
          mkdir -p "$dmg_root"
          cp -R apps/wails/build/bin/Lumina.app "$dmg_root/Lumina.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create -volname Lumina -srcfolder "$dmg_root" -ov -format UDZO "artifacts/$PACKAGE_NAME"

      - name: 归档 Linux 构建产物
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          test -f apps/wails/build/bin/Lumina
          tar -C apps/wails/build/bin -czf "artifacts/$PACKAGE_NAME" Lumina

      - name: 签名 macOS DMG 安装器
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo 'Skipping macOS DMG signing: signing identity is not configured.'
            exit 0
          fi
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" "artifacts/$PACKAGE_NAME"

      - name: 公证 macOS DMG 安装器
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_CERT_BASE64: ${{ secrets.MACOS_SIGN_CERT_BASE64 }}
          MACOS_SIGN_CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_SIGN_CERT_BASE64" ] || [ -z "$MACOS_SIGN_CERT_PASSWORD" ] || [ -z "$MACOS_SIGN_IDENTITY" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo 'Skipping macOS notarization: notarization/signing secrets are not fully configured.'
            exit 0
          fi
          xcrun notarytool submit "artifacts/$PACKAGE_NAME" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "artifacts/$PACKAGE_NAME"

      - name: 上传构建产物
        uses: actions/upload-artifact@v6
        with:
          name: lumina-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v5
        with:
          pattern: lumina-*
          path: release-assets
          merge-multiple: true

      - name: 生成校验清单
        run: |
          cd release-assets
          shasum -a 256 Lumina-* > checksums.txt

      - name: 生成发布说明
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > release-assets/RELEASE_NOTES.md <<EOF
          ## v${version} 🚀

          本次发布提供 Windows / macOS / Linux 三端安装包，统一采用 \`Lumina-版本-系统-架构\` 命名规范。

          ### ✨ 亮点
          - 统一发布资产命名，下载前即可识别版本、系统与架构。
          - macOS DMG 采用拖拽到 Applications 的标准安装布局。
          - 提供单一 \`checksums.txt\` 校验清单，降低资产噪音。

          ### 🛠 变更日志
          - **New:** 发布资产命名升级为标准格式。
          - **Improved:** 合并 SHA256 到单文件 \`checksums.txt\`。
          - **Improved:** Release 自动生成结构化说明与安装指引。

          ### 📦 安装指引
          - **Windows:** 下载 \`.exe\` 直接安装。
          - **macOS:** 下载 \`.dmg\`，将 App 拖入 Applications。
          - **Linux:** 下载 \`.tar.gz\` 后解压运行。

          ### 🧩 macOS 启动排障（临时）
          若 macOS 提示“已损坏/无法打开”，通常不是 App 真坏了，而是当前版本未经过 Apple Developer 签名 / 公证流程。说白一点，就是我还没给苹果交那笔开发者年费。可执行：
          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/Lumina.app
          \`\`\`

          ### 🔐 校验
          使用 \`checksums.txt\` 校验下载文件完整性：
          \`\`\`bash
          shasum -a 256 -c checksums.txt
          \`\`\`
          EOF

      - name: 发布 Release 并上传资源
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Lumina-*
            release-assets/checksums.txt
          fail_on_unmatched_files: true
          body_path: release-assets/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
