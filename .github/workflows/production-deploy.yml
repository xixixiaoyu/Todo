name: Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Validate deployment secrets
        run: |
          missing=0

          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo '::error::Missing secret SERVER_HOST (check repository secrets or environment "production" secrets).'
            missing=1
          fi

          if [ -z "${{ secrets.SERVER_USER }}" ]; then
            echo '::error::Missing secret SERVER_USER (check repository secrets or environment "production" secrets).'
            missing=1
          fi

          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo '::error::Missing secret SSH_PRIVATE_KEY (check repository secrets or environment "production" secrets).'
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy to Tencent Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /home/ubuntu/Todo
            git fetch origin main --prune
            git checkout main
            git reset --hard origin/main
            chmod +x deploy.sh
            ./deploy.sh
