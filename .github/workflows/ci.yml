name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]

permissions:
  contents: read

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '9.15.0'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 Docker Compose 配置
        run: |
          POSTGRES_PASSWORD=check REDIS_PASSWORD=check JWT_SECRET=check JWT_REFRESH_SECRET=check CORS_ORIGIN=http://localhost docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.dev.yml config >/dev/null

      - name: 校验生产镜像引用可复现
        run: |
          missing=$(grep -nE '^[[:space:]]*image:' docker-compose.yml | grep -v '@sha256:' | grep -v 'jc21/nginx-proxy-manager:2.13.7' || true)
          if [ -n "$missing" ]; then
            echo "$missing"
            exit 1
          fi

      - name: 配置 Turbo 缓存
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: 生成 Prisma Client
        run: pnpm db:generate

      - name: 格式检查
        run: pnpm format:check

      - name: Lint 检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm type-check

      - name: 运行测试
        run: pnpm test

      - name: 安全审计
        run: pnpm security-audit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 Docker Compose 配置
        run: |
          POSTGRES_PASSWORD=check REDIS_PASSWORD=check JWT_SECRET=check JWT_REFRESH_SECRET=check CORS_ORIGIN=http://localhost docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.dev.yml config >/dev/null

      - name: 校验生产镜像引用可复现
        run: |
          missing=$(grep -nE '^[[:space:]]*image:' docker-compose.yml | grep -v '@sha256:' | grep -v 'jc21/nginx-proxy-manager:2.13.7' || true)
          if [ -n "$missing" ]; then
            echo "$missing"
            exit 1
          fi

      - name: 配置 Turbo 缓存
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: 生成 Prisma Client
        run: pnpm db:generate

      - name: 构建项目
        run: pnpm build
